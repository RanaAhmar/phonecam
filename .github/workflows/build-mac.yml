name: Build Mac App (DMG)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Mac DMG
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: ls /Applications/ | grep Xcode

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd mac
          xcodegen generate --spec project.yml
          ls -la

      - name: Build Mac App (unsigned)
        run: |
          cd mac
          xcodebuild \
            -project PhoneCam.xcodeproj \
            -scheme PhoneCam \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Find built app
        run: |
          find mac/build -name "*.app" -type d 2>/dev/null
          ls mac/build/Build/Products/Release/ 2>/dev/null || true

      - name: Create DMG
        run: |
          APP_PATH=$(find mac/build -name "PhoneCam.app" -type d | head -1)
          echo "Building DMG from: $APP_PATH"
          
          mkdir -p dmg_staging
          cp -r "$APP_PATH" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          
          hdiutil create \
            -volname "PhoneCam" \
            -srcfolder dmg_staging \
            -ov \
            -format UDZO \
            PhoneCam.dmg
          
          ls -lh PhoneCam.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCam-Mac-DMG
          path: PhoneCam.dmg
          retention-days: 90

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PhoneCam.dmg
          token: ${{ secrets.GITHUB_TOKEN }}
