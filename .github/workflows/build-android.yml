name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --project-dir android

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon --project-dir android

      - name: Locate and rename APKs
        run: |
          find android -name "*.apk" | head -20
          DEBUG_APK=$(find android -name "*debug*.apk" | head -1)
          RELEASE_APK=$(find android -name "*release*.apk" | head -1)
          echo "Debug: $DEBUG_APK"
          echo "Release: $RELEASE_APK"
          [ -f "$DEBUG_APK" ] && cp "$DEBUG_APK" PhoneCam-debug.apk
          [ -f "$RELEASE_APK" ] && cp "$RELEASE_APK" PhoneCam.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCam-debug-apk
          path: PhoneCam-debug.apk
          retention-days: 90

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCam-release-apk
          path: PhoneCam.apk
          retention-days: 90

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PhoneCam.apk
            PhoneCam-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
