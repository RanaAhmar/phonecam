name: PhoneCam
options:
  bundleIdPrefix: com.phonecam.app
  deploymentTarget:
    macOS: "12.3"
  xcodeVersion: "16"

targets:
  PhoneCam:
    type: application
    platform: macOS
    deploymentTarget: "12.3"
    sources:
      - path: DroidCam
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
    info:
      path: DroidCam/Info.plist
      properties:
        CFBundleDisplayName: PhoneCam
        CFBundleIdentifier: com.phonecam.app
        CFBundleName: PhoneCam
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "12.3"
        LSUIElement: true
        NSCameraUsageDescription: "PhoneCam needs camera access to provide the virtual camera to other apps."
        NSLocalNetworkUsageDescription: "PhoneCam needs local network access to discover and connect to Android devices."
        NSBonjourServices:
          - _phonecam._tcp
        NSPrincipalClass: NSApplication
    entitlements:
      path: DroidCam/DroidCam.entitlements
    settings:
      PRODUCT_NAME: PhoneCam
      PRODUCT_BUNDLE_IDENTIFIER: com.phonecam.app
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "12.3"
      CODE_SIGN_STYLE: Manual
      ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - sdk: CoreMediaIO.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: VideoToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: IOKit.framework
      - sdk: Network.framework
